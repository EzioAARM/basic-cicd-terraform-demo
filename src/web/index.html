<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Terraform demo</title>
  <style>
    :root { --bg: #161b26; --fg: #ffffff; --accent: #ff9900; --muted: #9aa3b5; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: var(--bg); color: var(--fg);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      padding: 24px;
    }
    main { max-width: 640px; text-align: center; }
    h1 { font-size: clamp(1.6rem, 5vw, 2.6rem); margin: 0 0 12px; }
    .count { font-size: clamp(3.5rem, 14vw, 6rem); font-weight: 800; color: var(--accent); margin: 24px 0 4px; }
    p { color: var(--muted); margin: 0; }
    .flow { margin-top: 32px; font-size: 0.9rem; color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <h1 id="message">Cargando…</h1>
    <div class="count" id="visits">–</div>
    <p>visitas registradas en DynamoDB</p>
    <p class="flow">S3 · API Gateway → Lambda → DynamoDB</p>
  </main>
  <script src="config.js"></script>
  <script>
    fetch(`${window.API_URL}/api/visits`, { method: "POST" })
      .then((r) => { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then((d) => {
        document.getElementById("message").textContent = d.message;
        document.getElementById("visits").textContent = d.visits.toLocaleString("es-GT");
      })
      .catch(() => {
        document.getElementById("message").textContent = "No se pudo contactar la API";
      });
  </script>
</body>
</html>
