# ─────────────────────────────────────────────────────────────────────────────
# Fase Deploy: terraform apply del plan aprobado
#   1. Lee la configuración de Parameter Store
#   2. Instala Terraform
#   3. Aplica tfplan tal como se aprobó (no vuelve a planear)
# Las variables de Terraform ya están dentro de tfplan; no hace falta el tfvars.
# Si el state cambió después del plan, Terraform rechaza el apply ("Saved plan is stale").
# ─────────────────────────────────────────────────────────────────────────────
version: 0.2

env:
  shell: bash
  variables:
    TF_IN_AUTOMATION: "true"
    TF_INPUT: "false"

phases:
  install:
    commands:
      # Configuración del pipeline: TF_VERSION, TF_STATE_BUCKET, TF_STATE_KEY
      - aws ssm get-parameter --name "${PARAMETERS_PATH}/build" --query Parameter.Value --output text > /tmp/build.env
      - set -a && source /tmp/build.env && set +a

      # Terraform (versión fija, con verificación de checksum)
      - curl -sSfL -o /tmp/terraform.zip "https://releases.hashicorp.com/terraform/${TF_VERSION}/terraform_${TF_VERSION}_linux_amd64.zip"
      - curl -sSfL "https://releases.hashicorp.com/terraform/${TF_VERSION}/terraform_${TF_VERSION}_SHA256SUMS" | grep linux_amd64.zip | awk '{print $1"  /tmp/terraform.zip"}' | sha256sum -c -
      - unzip -o -q /tmp/terraform.zip -d /usr/local/bin

  pre_build:
    commands:
      - terraform init -backend-config="bucket=${TF_STATE_BUCKET}" -backend-config="key=${TF_STATE_KEY}" -backend-config="region=${AWS_REGION}" -backend-config="encrypt=true" -backend-config="use_lockfile=true"

  build:
    commands:
      - terraform apply tfplan
      - terraform output
