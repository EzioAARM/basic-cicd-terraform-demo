# ─────────────────────────────────────────────────────────────────────────────
# Fase Build: validaciones + terraform plan
#   1. Lee la configuración de Parameter Store
#   2. Instala Terraform y checkov
#   3. Revisa formato y seguridad
#   4. Genera el plan (tfplan) que se aprobará y aplicará en Deploy
# Variable de entorno del proyecto: PARAMETERS_PATH (/demo/infra/dev/parameters)
# ─────────────────────────────────────────────────────────────────────────────
version: 0.2

env:
  shell: bash
  variables:
    TF_IN_AUTOMATION: "true"
    TF_INPUT: "false"

phases:
  install:
    commands:
      # Configuración del pipeline: TF_VERSION, TF_STATE_BUCKET, TF_STATE_KEY
      - aws ssm get-parameter --name "${PARAMETERS_PATH}/build" --query Parameter.Value --output text > /tmp/build.env
      - set -a && source /tmp/build.env && set +a

      # Terraform (versión fija, con verificación de checksum) y checkov
      - curl -sSfL -o /tmp/terraform.zip "https://releases.hashicorp.com/terraform/${TF_VERSION}/terraform_${TF_VERSION}_linux_amd64.zip"
      - curl -sSfL "https://releases.hashicorp.com/terraform/${TF_VERSION}/terraform_${TF_VERSION}_SHA256SUMS" | grep linux_amd64.zip | awk '{print $1"  /tmp/terraform.zip"}' | sha256sum -c -
      - unzip -o -q /tmp/terraform.zip -d /usr/local/bin
      - pip3 install --quiet checkov

  pre_build:
    commands:
      # Formato y seguridad (checkov usa .checkov.yaml de la raíz del repo)
      - terraform fmt -check -recursive
      - checkov -d . --quiet --compact

      # Variables de Terraform desde Parameter Store
      - aws ssm get-parameter --name "${PARAMETERS_PATH}/tfvars" --query Parameter.Value --output text > terraform.tfvars

      - terraform init -backend-config="bucket=${TF_STATE_BUCKET}" -backend-config="key=${TF_STATE_KEY}" -backend-config="region=${AWS_REGION}" -backend-config="encrypt=true" -backend-config="use_lockfile=true"
      - terraform validate

  build:
    commands:
      - terraform plan -out=tfplan

# El artefacto lleva el repo, tfplan y el zip de la Lambda (.build/).
# Los providers (.terraform/) se reinstalan en Deploy con el mismo lock file.
artifacts:
  files:
    - "**/*"
  exclude-paths:
    - "**/.terraform/**"
